<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fd6">
<title>NFC 质检扫码</title>
<style>
:root{--bg:#f5f7fa;--surface:#fff;--text:#1d2939;--muted:#667085;--line:#e1e6ee;--primary:#1f5fd6;--ok:#16834d;--okbg:#e8f6ee;--warn:#b54708;--warnbg:#fff4e5;--bad:#b42318;--badbg:#fdecec}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px}
.top{display:flex;align-items:center;gap:10px}
.titles{flex:1;min-width:0}
h1{font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#subheading{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{font-size:13px;color:var(--muted);text-align:right}.progress b{color:var(--text);font-size:18px}
.bar{height:6px;background:#e9edf3;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
main{padding:12px 14px 110px;max-width:640px;margin:0 auto}
button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:0 14px;height:44px;cursor:pointer}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
button.danger{color:var(--bad);border-color:#f3c8c8}
button.small{height:34px;padding:0 11px;font-size:14px;border-radius:8px}
.icon{width:38px;height:38px;padding:0;border-radius:10px;font-size:18px;line-height:1;flex:none}
button:disabled{opacity:.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.card h2{font-size:16px;margin:0 0 12px}
label.field{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
label.field input{display:block;width:100%;height:46px;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:17px;color:var(--text)}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kinds button{height:64px;line-height:1.25}.kinds button small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.kinds button.on{border:2px solid var(--primary);color:var(--primary);font-weight:700}
.stage{text-align:center;transition:background .25s}
.stage.ok{background:var(--okbg)}.stage.warn{background:var(--warnbg)}.stage.bad{background:var(--badbg)}
.phase{display:inline-block;font-size:14px;font-weight:700;padding:4px 12px;border-radius:99px;background:#e8efff;color:var(--primary)}
.phase.qr{background:#f3efff;color:#6941c6}
.big{font-size:22px;font-weight:700;margin:8px 0 2px}
.hint{color:var(--muted);font-size:14px}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
.dots span{width:26px;height:26px;border-radius:50%;background:#e9edf3;font-size:12px;line-height:26px;color:var(--muted);font-weight:600}
.dots span.n{background:#cddcff;color:var(--primary)}.dots span.q{background:var(--okbg);color:var(--ok)}
video{width:100%;max-height:44vh;object-fit:cover;border-radius:12px;background:#000;margin-top:12px}
.camtools{display:flex;gap:8px;margin-top:8px}.camtools button{flex:1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{height:46px;padding:0 8px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
tr.badrow td{background:var(--badbg)}
.notice{font-size:14px;color:var(--bad);background:var(--badbg);border-radius:10px;padding:10px 12px;margin-top:12px;text-align:left}
.list .item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .item:last-child{border-bottom:0}
.list .item .body{flex:1;min-width:0}.list .item .meta{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--warnbg);color:var(--warn);margin-right:4px}
.tag.done{background:var(--okbg);color:var(--ok)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
footer button{flex:1;font-size:15px;padding:0 8px}footer #export{flex:1.6}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
dialog{border:0;border-radius:14px;padding:18px;width:min(440px,calc(100vw - 32px))}
dialog h3{margin:0 0 10px}dialog p{margin:0 0 10px;color:var(--muted);font-size:15px}
dialog input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px}
dialog .btns{display:flex;gap:8px;margin-top:14px}dialog .btns button{flex:1}
.pick{margin-bottom:12px}.pick>span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{height:38px;padding:0 12px;font-size:15px;border-radius:99px}.chips button.on{border:2px solid var(--primary);color:var(--primary);font-weight:700;background:#eef3ff}
.picked{margin:4px 0 14px;font-size:15px;color:var(--muted)}.picked b{color:var(--text);font-size:17px}
.dots{display:grid!important;grid-template-columns:repeat(var(--cols,10),minmax(0,30px));justify-content:center;gap:5px}
.dots span{width:auto!important;aspect-ratio:1;height:auto!important;display:flex;align-items:center;justify-content:center}
.dots span.f{background:var(--warnbg)!important;color:var(--warn)!important}
.chip{display:inline-block;height:32px;padding:0 14px;font-size:14px;border-radius:99px;margin-top:8px;color:var(--primary);border-color:#cddcff;background:#f5f8ff}
.done-group{padding:10px 0;border-bottom:1px solid var(--line)}.done-group:last-child{border-bottom:0}
.done-head{display:flex;align-items:baseline;gap:10px}.done-head span{font-size:12px;color:var(--muted)}
ol.codes{margin:6px 0 0;padding-left:34px;font:13px/1.7 ui-monospace,Consolas,monospace;color:#344054}
ol.codes em{font:12px system-ui,sans-serif;color:var(--warn);font-style:normal}
.aside{border:1px solid #f3d9b1;background:#fffaf2;border-radius:12px;padding:10px 12px;margin-top:8px}.aside.done{border-color:var(--line);background:#f8faf9;opacity:.75}
.aside-head{display:flex;align-items:center;gap:6px}.aside-head b{flex:1;font-size:15px}.aside-count{font-size:13px;color:var(--muted)}
.aside .aside-remove{margin-top:8px;width:100%}
</style>
</head>
<body>
<header>
  <div class="top"><div class="titles"><h1 id="heading">NFC 质检扫码</h1><small id="subheading"></small></div><div class="progress" id="progressText"></div><button class="icon" id="reset" title="清空当前内容，重新开始" hidden>⟲</button></div>
  <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
</header>
<main>
  <!-- 开始：选载体 -->
  <section class="card" id="setup">
    <h2>开始一种载体的质检</h2>
    <div class="pick"><span>平台</span><div class="chips" id="pickPlatform"></div></div>
    <div class="pick"><span>语言</span><div class="chips" id="pickLanguage"></div></div>
    <div class="pick"><span>载体</span><div class="chips" id="pickCarrier"></div></div>
    <p class="picked" id="picked"></p>
    <label class="field" id="groupField">默认每组张数（扫描时每组可单独改；填了计划总数，最后一组自动取剩下的数）<input id="groupSize" type="number" inputmode="numeric" min="1" value="10"></label>
    <label class="field">计划总数（扫满会提醒导出，可留空）<input id="planned" type="number" inputmode="numeric" min="1" placeholder="如：200"></label>
    <button class="primary" id="begin" style="width:100%">开始</button>
  </section>

  <!-- 扫描中 -->
  <section class="card stage" id="stage" hidden>
    <span class="phase" id="phase">NFC</span>
    <div class="big" id="title"></div>
    <div class="hint" id="hint"></div>
    <div class="dots" id="dots"></div>
    <button class="chip" id="groupChip" hidden></button>
    <video id="video" playsinline muted hidden></video>
    <div class="camtools" id="camtools" hidden><button class="small" id="torch">手电筒</button><button class="small" id="restartCam">重开相机</button></div>
    <div id="result"></div>
    <div class="actions" id="stageActions"></div>
    <button class="primary" id="startNfc" style="width:100%;margin-top:12px" hidden>开始扫描（打开 NFC）</button>
    <div class="notice" id="notice" hidden></div>
  </section>

  <section class="card" id="setAsideCard" hidden><h2>拎出去待处理 <span id="setAsideCount"></span></h2><p class="hint" style="margin:-6px 0 8px">线下处理好后，重新扫这一组 / 这一个即可，会排在后面计入</p><div class="list" id="setAsideList"></div></section>
  <section class="card" id="doneCard" hidden><h2>已通过（最新在上）</h2><div class="list" id="doneList"></div></section>
</main>
<footer id="footer" hidden><button id="undo">撤销上一组</button><button class="primary" id="export">导出</button><button id="finish">换载体</button></footer>

<dialog id="askDialog"><h3 id="askTitle"></h3><p id="askText"></p><input id="askInput" hidden><div class="btns"><button id="askCancel">取消</button><button class="danger" id="askAlt" hidden></button><button class="primary" id="askOk">确定</button></div></dialog>

<script>
// 质检扫码：NFC 与二维码边扫边核对，通过的才计入；导出两份顺序一致的文件（二维码 / NFC），格式与原来的 NFC 读取工具相同，直接导入 NFC 运营台质检。
// 每次变动都立即存到本机（localStorage），刷新或误关后重新打开会接着上次的进度。
const KEY="nfc-qc-v1",PREFIX="https://review.hotlabel.co/PublicBinding/Bind?code=",UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const $=id=>document.getElementById(id);
// 平台、语言、载体与运营台一致；载体名同运营台用途文字（如“英-黑卡”“TikTok 英-彩卡”），导出文件带上这三项，运营台可直接按文件分到对应载体。
const PLATFORMS=["Google","Instagram","Facebook","TikTok","YouTube"],LANGUAGES=["英文","德文"],CARRIERS=["黑卡","白卡","彩卡","黑立牌","白立牌","共享黑立牌","共享白立牌"];
const FAIL_NFC="#NFC失效",FAIL_QR="#二维码失效",isFail=value=>value===FAIL_NFC||value===FAIL_QR;
const carrierLabel=(platform,language,carrier)=>`${platform==="Google"?"":platform+" "}${language==="德文"?"德":"英"}-${carrier}`;
let pick={platform:"Google",language:"英文",carrier:"黑卡"};
const fresh=()=>({session:null,groups:[],current:{nfcs:[],qrs:[]},phase:"nfc",check:null,setAside:[],exportedCount:0,fullNotified:false});
let state=fresh(),reader=null,stream=null,detector=null,scanning=false,lastQr="",lastQrAt=0,wake=null,torchOn=false;
try{const saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved&&saved.session)state={...fresh(),...saved}}catch{}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(error){showNotice("本机存储失败："+error.message+"。请尽快导出")}};
try{navigator.storage?.persist?.()}catch{}

const codeOf=link=>{const text=String(link||"").trim();return text.startsWith(PREFIX)&&UUID.test(text.slice(PREFIX.length))?text.slice(PREFIX.length).toLowerCase():""};
const shortLink=link=>{if(link===FAIL_NFC)return"NFC 失效";if(link===FAIL_QR)return"二维码失效";const code=codeOf(link);return code?`${code.slice(0,8)}…${code.slice(-4)}`:(String(link||"").slice(0,28)||"（空）")};
const itemCode=item=>codeOf(item.nfc)||codeOf(item.qr);
const passed=()=>state.groups.reduce((n,group)=>n+group.items.length,0);
const known=()=>{const set=new Set();for(const group of state.groups)for(const item of group.items){const code=itemCode(item);if(code)set.add(code)}return set};
const now=()=>new Date().toLocaleString("zh-CN",{hour12:false});
const isCard=()=>state.session?.kind==="card";
/** 本组张数：手动改过的优先；否则默认张数，填了计划总数时不超过剩余张数（如 201 张：20 组 10 张 + 最后 1 组 1 张）。 */
const groupTarget=()=>{if(!isCard())return 1;if(state.current.size)return state.current.size;const s=state.session,remaining=s.planned?s.planned-passed():0;return remaining>0?Math.min(s.groupSize,remaining):s.groupSize};
async function editGroupSize(){
  const value=await ask({title:"改这一组的张数",text:`这一组连在一起的一共几张？（已扫 ${state.current.nfcs.length} 张）`,input:String(groupTarget())});
  if(value===null)return;const size=Math.floor(Number(value));
  if(!size||size<1||size<state.current.nfcs.length){await ask({title:"张数不对",text:`请填一个不少于已扫张数（${state.current.nfcs.length}）的整数`});return}
  state.current.size=size;save();
  if(state.current.nfcs.length>=size){state.phase="qr";save();render();startCamera();return}
  render();
}

function beep(ok){try{navigator.vibrate&&navigator.vibrate(ok?60:[90,60,90])}catch{}try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=ok?880:280;gain.gain.value=.08;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+(ok?.07:.3))}catch{}}
function showNotice(text){const n=$("notice");n.hidden=!text;n.textContent=text||""}
function ask({title,text,input,okText="确定",altText=""}){return new Promise(resolve=>{$("askTitle").textContent=title;$("askText").textContent=text||"";$("askInput").hidden=!input;$("askInput").value=/^\d+$/.test(input||"")?input:"";$("askInput").placeholder=input||"";$("askOk").textContent=okText;$("askAlt").hidden=!altText;$("askAlt").textContent=altText;const d=$("askDialog");const done=value=>{d.close();$("askOk").onclick=$("askCancel").onclick=$("askAlt").onclick=null;resolve(value)};$("askOk").onclick=()=>done(input?$("askInput").value.trim()||"未填原因":true);$("askAlt").onclick=()=>done("alt");$("askCancel").onclick=()=>done(null);d.showModal();if(input)setTimeout(()=>$("askInput").focus(),50)})}

// ---------- 核对 ----------
function checkGroup(nfcs,qrs){
  const problems=[],rows=[],seen=known(),inGroup=new Set();
  const len=Math.max(nfcs.length,qrs.length);
  for(let i=0;i<len;i++){
    const nfc=nfcs[i]||"",qr=qrs[i]||"",issues=[],notes=[];
    if(!nfc)issues.push("缺 NFC");if(!qr)issues.push("缺二维码");
    if(nfc===FAIL_NFC)notes.push("NFC 失效");if(qr===FAIL_QR)notes.push("二维码失效");
    if(nfc&&!isFail(nfc)&&!codeOf(nfc))issues.push("NFC 链接格式不对");if(qr&&!isFail(qr)&&!codeOf(qr))issues.push("二维码链接格式不对");
    if(nfc&&qr&&!isFail(nfc)&&!isFail(qr)&&nfc!==qr)issues.push("NFC 与二维码不一致");
    const code=itemCode({nfc,qr});if(code&&seen.has(code))issues.push("之前已通过，重复");if(code&&inGroup.has(code))issues.push("本组内重复");if(code)inGroup.add(code);
    rows.push({nfc,qr,issues,notes});
  }
  if(nfcs.length!==qrs.length)problems.push(`张数对不上：NFC ${nfcs.length} 张，二维码 ${qrs.length} 张，可能有漏扫`);
  const reversed=nfcs.length>1&&nfcs.length===qrs.length&&nfcs.every((value,i)=>isFail(value)||isFail(qrs[qrs.length-1-i])||value===qrs[qrs.length-1-i])&&nfcs.some((value,i)=>!isFail(value)&&!isFail(qrs[i])&&value!==qrs[i]);
  if(reversed)problems.unshift("这一组头尾放反了：二维码顺序正好是 NFC 倒过来");
  else if(nfcs.length===qrs.length&&nfcs.length>1&&[...nfcs].sort().join()===[...qrs].sort().join()&&nfcs.some((value,i)=>value!==qrs[i]))problems.unshift("这一组顺序被打乱了：是同一批卡，但顺序不同");
  const bad=rows.filter(row=>row.issues.length).length;
  if(bad&&!reversed)problems.push(`${bad} 张有问题，见下表`);
  return{ok:!problems.length&&!bad,reversed,problems,rows};
}

// ---------- 读入 ----------
// 卡贴着不动时手机会连续读到同一张：同一链接 2 秒内只算一次（连在一起的卡每张编码不同，不受影响）。
let lastNfc="",lastNfcAt=0;
function onNfc(link){
  const t=Date.now();if(link===lastNfc&&t-lastNfcAt<2000){lastNfcAt=t;return}lastNfc=link;lastNfcAt=t;
  if(!state.session||state.check)return;
  if(state.phase!=="nfc"){flashStage("warn");setHint("现在是扫二维码阶段，NFC 没有记录");return}
  state.current.nfcs.push(link);save();beep(isFail(link)||Boolean(codeOf(link)));
  if(!isCard()){state.phase="qr";save();render();startCamera();return}
  if(state.current.nfcs.length>=groupTarget()){state.phase="qr";save();render();startCamera();return}
  render();
}
function onQr(link){
  if(!state.session||state.check||state.phase!=="qr")return;
  const t=Date.now();if(link===lastQr&&t-lastQrAt<4000)return;lastQr=link;lastQrAt=t;
  if(!isFail(link)&&state.current.qrs.includes(link)&&isCard()){flashStage("warn");setHint("这张二维码刚扫过，请换下一张");return}
  state.current.qrs.push(link);save();beep(isFail(link)||Boolean(codeOf(link)));
  if(state.current.qrs.length>=state.current.nfcs.length){stopCamera();finishGroup();return}
  render();
}
// NFC / 二维码读不到：占一个位置记为失效，顺序不乱；导入运营台后这张判为“无法识别”（异常待处置）。
function skipNfc(){if(state.phase!=="nfc"||state.check)return;lastNfc="";onNfc(FAIL_NFC)}
function skipQr(){if(state.phase!=="qr"||state.check)return;lastQr="";onQr(FAIL_QR)}
function finishGroup(){
  const result=checkGroup(state.current.nfcs,state.current.qrs);
  if(result.ok){acceptCurrent();return}
  state.check=result;save();beep(false);render();
}
function acceptCurrent(){
  const items=state.current.nfcs.map((nfc,i)=>({nfc,qr:state.current.qrs[i]}));
  state.groups.push({items,time:now()});state.current={nfcs:[],qrs:[]};state.phase="nfc";state.check=null;
  // 之前拎出去的组，编码全部通过后自动标为已处理
  const ok=known();for(const item of state.setAside)if(!item.resolved&&item.codes.length&&item.codes.every(code=>ok.has(code)))item.resolved=now();
  save();beep(true);flashStage("ok");render();
  const planned=state.session.planned;
  if(planned&&passed()>=planned&&!state.fullNotified){state.fullNotified=true;save();setTimeout(async()=>{if(await ask({title:"这个载体已扫满",text:`已通过 ${passed()} 张（计划 ${planned} 张）。请现在导出两份文件。`,okText:"导出"}))exportFiles()},400)}
}
async function setAsideCurrent(defaultReason){
  const reason=await ask({title:isCard()?"把这一组拎出去":"把这一个拎出去",text:"不计入本次结果，记到“待处理”清单。请写一下原因",input:defaultReason||"原因，如：NFC 读不到"});
  if(reason===null)return;
  const links=[...state.current.nfcs,...state.current.qrs],codes=[...new Set(links.map(codeOf).filter(Boolean))];
  state.setAside.push({time:now(),reason,count:Math.max(state.current.nfcs.length,state.current.qrs.length),nfcs:state.current.nfcs,qrs:state.current.qrs,codes});
  state.current={nfcs:[],qrs:[]};state.phase="nfc";state.check=null;stopCamera();save();render();
}
function rescanQr(){state.current.qrs=[];state.check=null;state.phase="qr";save();render();startCamera()}
function rescanAll(){state.current={nfcs:[],qrs:[]};state.check=null;state.phase="nfc";stopCamera();save();render()}

// ---------- NFC / 相机 ----------
async function startNfc(){
  if(!("NDEFReader" in window)){showNotice("这个浏览器不能读 NFC。请用安卓手机的 Chrome 打开。");return}
  // 整个页面只开一个读卡器：重复新建会让一次贴卡触发多次读取。
  if(reader){showNotice("");render();return}
  try{reader=new NDEFReader();await reader.scan();
    reader.onreading=event=>{let link="";for(const record of event.message.records){try{const text=new TextDecoder(record.encoding||"utf-8").decode(record.data);if(text.includes("://")||!link)link=text.trim()}catch{}}onNfc(link)};
    reader.onreadingerror=()=>{flashStage("bad");setHint("NFC 读取失败，请贴稳一点再试")};
    showNotice("");render();try{wake=await navigator.wakeLock?.request("screen")}catch{}
  }catch(error){showNotice(`无法打开 NFC：${error.message||error}。请确认手机 NFC 已打开，并允许本网页使用 NFC。`)}
}
async function loadJsQr(){if(window.jsQR)return true;return new Promise(resolve=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s)})}
async function startCamera(){
  if(stream)return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    const video=$("video");video.srcObject=stream;video.hidden=false;$("camtools").hidden=false;await video.play();
    if("BarcodeDetector" in window){try{detector=new BarcodeDetector({formats:["qr_code"]})}catch{detector=null}}
    if(!detector&&!(await loadJsQr())){showNotice("这个浏览器无法识别二维码，请用安卓手机的 Chrome。");return}
    scanning=true;lastQr="";loop();
  }catch(error){stream=null;showNotice(`无法打开相机：${error.message||error}。请允许本网页使用相机后点“重开相机”。`);$("camtools").hidden=false}
}
const canvas=document.createElement("canvas"),ctx2d=canvas.getContext("2d",{willReadFrequently:true});
async function loop(){
  if(!scanning)return;const video=$("video");
  try{if(video.readyState>=2){
    if(detector){const codes=await detector.detect(video);if(codes[0]?.rawValue)onQr(codes[0].rawValue.trim())}
    else if(window.jsQR){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx2d.drawImage(video,0,0);const img=ctx2d.getImageData(0,0,canvas.width,canvas.height),found=jsQR(img.data,img.width,img.height);if(found?.data)onQr(found.data.trim())}
  }}catch{}
  if(scanning)setTimeout(loop,120);
}
function stopCamera(){scanning=false;if(stream){for(const track of stream.getTracks())track.stop();stream=null}const video=$("video");video.srcObject=null;video.hidden=true;$("camtools").hidden=true;torchOn=false}
async function toggleTorch(){const track=stream?.getVideoTracks()[0];if(!track)return;try{torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]})}catch{showNotice("这台手机不支持网页打开手电筒")}}

// ---------- 导出 ----------
async function exportFiles(){
  const items=state.groups.flatMap(group=>group.items);
  if(!items.length&&!state.setAside.length){await ask({title:"还没有可导出的",text:"还没有通过核对的记录"});return}
  const stamp=new Date().toISOString().slice(0,16).replace(/[-:T]/g,"").replace(/^(\d{8})/,"$1-"),s=state.session,name=s.label.replace(/[\\/:*?"<>|]/g,"-");
  // 一个“质检文件”：每行一张卡，NFC、二维码同一行，按通过顺序；带平台、语言、载体，运营台可直接分到对应载体。失效的那一侧留空。
  let group=0;const cell=value=>/[",\n]/.test(String(value))?`"${String(value).replace(/"/g,'""')}"`:String(value);
  const rows=state.groups.flatMap(g=>{group++;return g.items.map(item=>[group,isFail(item.nfc)?"":item.nfc,isFail(item.qr)?"":item.qr,[isFail(item.nfc)?"NFC失效":"",isFail(item.qr)?"二维码失效":""].filter(Boolean).join("、")])});
  const combined="\ufeff序号,组,NFC链接,二维码链接,问题,平台,语言,载体\r\n"+rows.map((row,i)=>[i+1,...row,s.platform||"Google",s.language||"英文",s.carrier||s.label].map(cell).join(",")).join("\r\n")+"\r\n";
  const files=[new File([combined],`质检_${name}_${items.length}张_${stamp}.csv`,{type:"text/csv"})];
  const pending=state.setAside.filter(item=>!item.resolved);
  if(pending.length){const head="\ufeff时间,张数,原因,NFC,二维码\r\n",body=pending.map(item=>[item.time,item.count,item.reason,item.nfcs.join(" "),item.qrs.join(" ")].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");files.push(new File([head+body+"\r\n"],`质检_${name}_待处理${pending.length}项_${stamp}.csv`,{type:"text/csv"}))}
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:`${name} 质检文件`});markExported();return}}catch(error){if(error.name==="AbortError")return}
  for(const file of files){const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();await new Promise(r=>setTimeout(r,400));URL.revokeObjectURL(a.href);a.remove()}
  markExported();
}
function markExported(){state.exportedCount=passed();save();render()}

// ---------- 界面 ----------
function flashStage(kind){const s=$("stage");s.classList.remove("ok","warn","bad");s.classList.add(kind);clearTimeout(flashStage.t);flashStage.t=setTimeout(()=>s.classList.remove(kind),1500)}
function setHint(text){$("hint").textContent=text}
function render(){
  const has=Boolean(state.session);
  $("setup").hidden=has;$("reset").hidden=!has;$("stage").hidden=!has;$("footer").hidden=!has;$("barWrap").hidden=!has||!state.session?.planned;
  if(!has){$("heading").textContent="NFC 质检扫码";$("subheading").textContent="";$("progressText").innerHTML="";return}
  const s=state.session,count=passed();
  $("heading").textContent=s.label;$("subheading").textContent=s.kind==="card"?`卡片 · 默认 ${s.groupSize} 张一组`:"立牌 · 一个一个扫";
  $("progressText").innerHTML=`已通过 <b>${count}</b>${s.planned?` / ${s.planned}`:""} 张`;
  if(s.planned)$("bar").style.width=Math.min(100,count/s.planned*100)+"%";
  const c=state.current,qr=state.phase==="qr";
  $("phase").textContent=qr?"扫二维码":"扫 NFC";$("phase").className="phase"+(qr?" qr":"");
  $("startNfc").hidden=Boolean(reader)||qr||Boolean(state.check);
  const full=Boolean(s.planned&&count>=s.planned);
  // 进度点：本组每一张
  const total=isCard()?(qr?c.nfcs.length:groupTarget()):1,cols=Math.min(total,10);$("dots").style.setProperty("--cols",cols);
  $("dots").innerHTML=isCard()?Array.from({length:total},(_,i)=>{const n=c.nfcs[i],q=c.qrs[i];return`<span class="${q!==undefined?(isFail(q)?"f":"q"):n!==undefined?(isFail(n)?"f":"n"):""}">${i+1}</span>`}).join(""):"";
  const chip=$("groupChip");chip.hidden=!(isCard()&&reader&&!qr&&!state.check);chip.textContent=`本组 ${groupTarget()} 张 · 改`;
  const actions=$("stageActions");actions.innerHTML="";const add=(text,fn,cls)=>{const b=document.createElement("button");b.textContent=text;if(cls)b.className=cls;b.onclick=fn;actions.appendChild(b)};
  $("result").innerHTML="";
  if(state.check){
    const r=state.check;$("title").textContent=r.reversed?"这一组放反了":isCard()?"这一组没有通过":"这一个没有通过";setHint("不计入结果。请按下面的提示处理");
    $("result").innerHTML=`<div class="notice">${r.problems.map(p=>`• ${p}`).join("<br>")}</div><table><tr><th>#</th><th>NFC</th><th>二维码</th><th>问题</th></tr>${r.rows.map((row,i)=>`<tr class="${row.issues.length?"badrow":""}"><td>${i+1}</td><td class="code">${shortLink(row.nfc)}</td><td class="code">${shortLink(row.qr)}</td><td>${[...row.issues,...row.notes].join("、")||"✓"}</td></tr>`).join("")}</table>`;
    if(c.nfcs.length)add("只重扫二维码",rescanQr,"primary");
    add(isCard()?"整组重扫":"这一个重扫",rescanAll);add(isCard()?"拎出这组":"拎出",()=>setAsideCurrent(r.problems[0]),"danger");
  }else if(qr){
    $("title").textContent=isCard()?`扫二维码 ${c.qrs.length + 1} / ${c.nfcs.length}`:"扫这个立牌的二维码";
    setHint(isCard()?"按刚才 NFC 的顺序，从第一张开始对准相机":"对准立牌上的二维码");
    add("这张二维码读不到",skipQr);
    if(isCard()&&c.qrs.length)add("撤销上一张",()=>{c.qrs.pop();lastQr="";save();render()});
    add(isCard()?"拎出这组":"拎出这个",()=>setAsideCurrent("二维码读不到"),"danger");
  }else{
    // 扫满计划后不再显示“1 / 10”，说明多做的可以继续扫
    $("title").textContent=!reader?"点下方按钮开始":full&&!c.nfcs.length?`计划 ${s.planned} 张已扫满`:isCard()?`扫 NFC ${c.nfcs.length+1} / ${groupTarget()}`:"扫下一个立牌的 NFC";
    setHint(full&&!c.nfcs.length?"厂家多做的继续贴卡，会接着计入；没有了就点“导出”":full?`多做的部分 · 已通过 ${count} 张`:isCard()?"从头到尾依次贴卡，满一组自动扫二维码":"贴手机背面，读到后会打开相机扫二维码");
    if(reader)add("这张 NFC 读不到",skipNfc);
    if(isCard()&&c.nfcs.length){add("撤销上一张",()=>{c.nfcs.pop();save();render()});add(`只有 ${c.nfcs.length} 张，扫二维码`,()=>{state.phase="qr";save();render();startCamera()});add("拎出这组",()=>setAsideCurrent("这组有问题"),"danger")}
  }
  // 待处理
  const aside=state.setAside;$("setAsideCard").hidden=!aside.length;$("setAsideCount").textContent=`${aside.filter(item=>!item.resolved).length} 项未处理`;
  $("setAsideList").innerHTML=[...aside].reverse().map((item,index)=>{const codes=item.nfcs.length?item.nfcs:item.qrs;return`<div class="aside${item.resolved?" done":""}"><div class="aside-head">${item.resolved?'<span class="tag done">已重新通过</span>':'<span class="tag">待处理</span>'}<b>${item.reason}</b><span class="aside-count">${item.count} 张</span></div><div class="meta">${item.time}</div><ol class="codes">${codes.map(link=>`<li>${shortLink(link)}</li>`).join("")}</ol>${item.resolved?"":`<button class="small aside-remove" data-index="${aside.length-1-index}">处理好了，移出清单</button>`}</div>`}).join("");
  document.querySelectorAll(".aside-remove").forEach(button=>button.onclick=async()=>{const item=state.setAside[Number(button.dataset.index)];if(item&&await ask({title:"移出待处理清单",text:`这 ${item.count} 张已经线下处理好（或不要了）？移出后不再导出到待处理清单`})){item.resolved=now();item.reason+="（已手动处理）";save();render()}});
  // 已通过
  $("doneCard").hidden=!state.groups.length;let n=passed();
  $("doneList").innerHTML=[...state.groups].reverse().slice(0,30).map(group=>{const end=n,start=n-group.items.length+1;n=start-1;return`<div class="done-group"><div class="done-head"><b>${start===end?`第 ${end} 张`:`第 ${start}–${end} 张`}</b><span>${group.items.length} 张 · ${group.time.slice(-8)}</span></div><ol class="codes" start="${start}">${group.items.map(item=>`<li>${shortLink(isFail(item.nfc)?item.qr:item.nfc)}${isFail(item.nfc)?' <em>NFC 失效</em>':""}${isFail(item.qr)?' <em>二维码失效</em>':""}</li>`).join("")}</ol></div>`}).join("");
  $("undo").disabled=!state.groups.length;$("undo").textContent=isCard()?"撤销上一组":"撤销上一个";
  $("export").textContent=passed()>state.exportedCount?`导出（未导 ${passed()-state.exportedCount}）`:"导出";
}

function renderPick(){
  const chips=(id,options,key)=>{$(id).innerHTML=options.map(option=>`<button type="button" class="${pick[key]===option?"on":""}" data-v="${option}">${option}</button>`).join("");$(id).querySelectorAll("button").forEach(button=>button.onclick=()=>{pick[key]=button.dataset.v;renderPick()})};
  chips("pickPlatform",PLATFORMS,"platform");chips("pickLanguage",LANGUAGES,"language");chips("pickCarrier",CARRIERS,"carrier");
  const stand=pick.carrier.includes("立牌");$("groupField").hidden=stand;
  $("picked").innerHTML=`本次：<b>${carrierLabel(pick.platform,pick.language,pick.carrier)}</b>（${stand?"立牌，一个一个扫":"卡片，一组一组扫"}）`;
}
$("begin").onclick=()=>{
  const kind=pick.carrier.includes("立牌")?"stand":"card",groupSize=Math.max(1,Math.floor(Number($("groupSize").value)||10)),planned=Math.floor(Number($("planned").value))||0;
  state={...fresh(),session:{label:carrierLabel(pick.platform,pick.language,pick.carrier),platform:pick.platform,language:pick.language,carrier:pick.carrier,kind,groupSize:kind==="card"?groupSize:1,planned,startedAt:now()}};save();render();startNfc();
};
$("groupChip").onclick=editGroupSize;
$("startNfc").onclick=startNfc;
$("torch").onclick=toggleTorch;$("restartCam").onclick=()=>{stopCamera();startCamera()};
$("undo").onclick=async()=>{const last=state.groups.at(-1);if(!last)return;if(await ask({title:"撤销上一组",text:`撤销最后通过的 ${last.items.length} 张？撤销后需要重新扫这一组`}))
  {state.groups.pop();state.fullNotified=false;if(state.exportedCount>passed())state.exportedCount=passed();save();render()}};
$("export").onclick=()=>exportFiles();
// 换载体 / 清空：没导出时可以先导出，也可以不要了直接换（当前数据不一定是想要的）。
async function leaveSession(title){
  const unexported=passed()-state.exportedCount;
  if(unexported>0||state.current.nfcs.length){
    const choice=await ask({title,text:`${unexported>0?`有 ${unexported} 张通过的记录还没导出。`:""}${state.current.nfcs.length?"当前这组还没扫完。":""}要怎么处理？`,okText:"先导出",altText:"不要了，直接清空"});
    if(choice===null)return false;
    if(choice===true){await exportFiles();if(passed()>state.exportedCount)return false}
    else if(!(await ask({title:"再次确认",text:"清空后无法恢复，确定不要这些记录了吗？",okText:"确定清空"})))return false;
  }else if(!(await ask({title,text:"清空当前内容，开始新的载体？"})))return false;
  stopCamera();state=fresh();save();render();return true;
}
$("finish").onclick=()=>leaveSession("换一种载体");
$("reset").onclick=()=>leaveSession("清空当前内容");
window.addEventListener("beforeunload",event=>{if(state.session&&(passed()>state.exportedCount||state.current.nfcs.length)){event.preventDefault();event.returnValue=""}});
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&(!wake||wake.released)&&reader){try{wake=await navigator.wakeLock?.request("screen")}catch{}}});
// 刷新后恢复：二维码阶段重新打开相机，NFC 需要点一下按钮重新开启（浏览器要求）
renderPick();render();if(state.session&&state.phase==="qr"&&!state.check)startCamera();
</script>
</body>
</html>
